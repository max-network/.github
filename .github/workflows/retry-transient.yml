name: Retry transient failures

on:
  workflow_call:
    inputs:
      max-attempts:
        description: "Attempts per run, the first included. After attempt n fails on a transient error, the failed jobs rerun n minutes later."
        type: number
        default: 5
      shared-ref:
        description: "Ref of max-network/.github whose scripts/transient-failure.sh classifies the failed logs."
        type: string
        default: main

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: retry transient failure
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < inputs.max-attempts &&
      github.event.workflow_run.name != github.workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: retry-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: max-network/.github
          ref: ${{ inputs.shared-ref }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Classify the failed jobs
        id: classify
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --attempt "$ATTEMPT" --log-failed > "$RUNNER_TEMP/failed.log" || true
          set +e
          verdict=$(bash scripts/transient-failure.sh < "$RUNNER_TEMP/failed.log")
          status=$?
          set -e
          {
            echo "### [$RUN_NAME attempt $ATTEMPT]($RUN_URL)"
            echo '```'
            echo "$verdict"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$verdict"
          if [ "$status" -eq 0 ]; then
            echo "transient=true" >> "$GITHUB_OUTPUT"
          else
            echo "transient=false" >> "$GITHUB_OUTPUT"
            echo "A failed job did not fail on a transient error; leaving the run for a person."
          fi

      - name: Back off, then rerun the failed jobs
        if: steps.classify.outputs.transient == 'true'
        run: |
          echo "Rerunning the failed jobs of $RUN_NAME in $ATTEMPT minute(s)."
          sleep $((ATTEMPT * 60))
          state=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,attempt --jq '"\(.status) \(.attempt)"')
          if [ "$state" != "completed $ATTEMPT" ]; then
            echo "Someone already reran it ($state)."
            exit 0
          fi
          gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
          echo "Started attempt $((ATTEMPT + 1)) of $RUN_NAME." >> "$GITHUB_STEP_SUMMARY"
