name: Publish package

# The one npm publish pipeline: gate via check.yml, then publish package.json's version if the
# registry does not have it yet. Auth tries GH_PACKAGES_TOKEN, then the workflow token, and
# uses the first one the registry accepts; npmjs without NPM_TOKEN uses OIDC trusted
# publishing. A caller in another org passes GH_PACKAGES_TOKEN by name, since `inherit` does
# not cross orgs.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node major to build and publish with."
        type: string
        default: "22"
      check-steps:
        description: "Space-separated scripts for the check.yml gate, the same suite a pull request runs."
        type: string
        default: "typecheck test build"
      tag-release:
        description: "Push a `v<version>` tag at the published commit."
        type: boolean
        default: false
      create-release:
        description: "Also cut a GitHub Release for that tag."
        type: boolean
        default: false
      runtime:
        description: "`npm` (default) or `bun`, passed to check.yml and used for the install."
        type: string
        default: npm
      scope:
        description: "npm scope to authenticate, for a caller publishing outside @max-network."
        type: string
        default: "@max-network"
      registry:
        description: "Registry to publish to. https://registry.npmjs.org for a package meant for people outside the org."
        type: string
        default: "https://npm.pkg.github.com"
      gate:
        description: "Run check.yml first. Off only when the caller gates the publish in its own `needs` job."
        type: boolean
        default: true
      install:
        description: >-
          `auto` (default) installs with `npm ci` or `bun install --frozen-lockfile` per
          `runtime`. `none` skips the install. Anything else is run as the install command.
          Passed to check.yml as well.
        type: string
        default: auto
      backport-dist-tag:
        description: >-
          Dist-tag for a version lower than the registry's current `latest`, so publishing a
          backport does not move `latest` back to an older line.
        type: string
        default: legacy
    secrets:
      GH_PACKAGES_TOKEN:
        description: "Classic PAT tried first for GitHub Packages. Optional."
        required: false
      NPM_TOKEN:
        description: "npmjs token. Without it, npmjs publishes use OIDC trusted publishing."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  # Full path, because `./` inside a reusable workflow resolves against the caller.
  check:
    if: inputs.gate
    uses: max-network/.github/.github/workflows/check.yml@main
    with:
      node-version: ${{ inputs.node-version }}
      steps: ${{ inputs.check-steps }}
      runtime: ${{ inputs.runtime }}
      install: ${{ inputs.install }}
    secrets: inherit

  publish:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.probe.outputs.version }}
      published: ${{ steps.probe.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: inputs.runtime != 'bun' && inputs.install == 'auto'
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry }}
          scope: ${{ inputs.scope }}
          cache: npm

      - uses: actions/setup-node@v7
        if: inputs.runtime == 'bun' || inputs.install != 'auto'
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry }}
          scope: ${{ inputs.scope }}

      - uses: oven-sh/setup-bun@v2
        if: inputs.runtime == 'bun'
        with:
          bun-version: latest

      - name: Install dependencies
        if: inputs.install != 'none'
        uses: max-network/.github/.github/actions/install@main
        with:
          command: ${{ inputs.install != 'auto' && inputs.install || (inputs.runtime == 'bun' && 'bun install --frozen-lockfile' || 'npm ci') }}
          pat: ${{ secrets.GH_PACKAGES_TOKEN }}
          workflow-token: ${{ github.token }}

      # Only a 404 means "not published yet"; any other registry error stops the run rather
      # than turning into a publish attempt that fails with an unrelated write error.
      - name: Publish if the version is new
        id: probe
        env:
          PAT: ${{ secrets.GH_PACKAGES_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REGISTRY: ${{ inputs.registry }}
          BACKPORT_TAG: ${{ inputs.backport-dist-tag }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          probe_with() {
            GITHUB_TOKEN="$1" NODE_AUTH_TOKEN="$1" npm view "$NAME" version 2>&1 || true
          }

          TOKEN=""
          OIDC=""
          if [ "$REGISTRY" = "https://registry.npmjs.org" ]; then
            if [ -n "${NPM_TOKEN:-}" ]; then
              TOKEN="$NPM_TOKEN"
              echo "npm auth: NPM_TOKEN"
            else
              OIDC=1
              echo "npm auth: OIDC trusted publishing"
            fi
          fi

          for label in GH_PACKAGES_TOKEN "workflow token"; do
            [ -z "$OIDC" ] || break
            [ -z "$TOKEN" ] || break
            case "$label" in
              GH_PACKAGES_TOKEN) candidate="${PAT:-}" ;;
              *)                 candidate="$WORKFLOW_TOKEN" ;;
            esac
            [ -n "$candidate" ] || continue

            OUT=$(probe_with "$candidate")
            if ! printf '%s' "$OUT" | grep -qE "E401|E403|code E4[01]"; then
              TOKEN="$candidate"
              echo "npm auth: $label"
              break
            fi
            echo "npm auth: $label rejected by the registry, trying the next credential"
          done

          if [ -z "$TOKEN" ] && [ -z "$OIDC" ]; then
            echo "::error::No credential could read $NAME. GH_PACKAGES_TOKEN was rejected or absent, and the workflow token lacks access to this package. Grant this repository access under Package settings -> Manage Actions access, or refresh GH_PACKAGES_TOKEN."
            exit 1
          fi

          set +e
          OUT=$(GITHUB_TOKEN="$TOKEN" NODE_AUTH_TOKEN="$TOKEN" npm view "$NAME@$VERSION" version 2>&1)
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "\`$NAME@$VERSION\` is already on the registry — nothing to publish. Bump the version in package.json to cut a release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif ! printf '%s' "$OUT" | grep -q "E404"; then
            echo "::error::Could not determine whether $NAME@$VERSION is published. Refusing to guess."
            echo "$OUT"
            exit 1
          fi

          # npm moves `latest` to whatever it publishes last, so a backport would hand new
          # installs the older line.
          LATEST=$(GITHUB_TOKEN="$TOKEN" NODE_AUTH_TOKEN="$TOKEN" npm view "$NAME" dist-tags.latest 2>/dev/null || true)
          DIST_TAG=latest
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            DIST_TAG="$BACKPORT_TAG"
          fi

          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "Publishing \`$NAME@$VERSION\` as \`$DIST_TAG\` (latest was \`${LATEST:-none}\`)." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$OIDC" ]; then
            # Trusted publishing needs npm >= 11.5.1, newer than the runner ships. npmjs matches
            # the caller's workflow filename, so each package registers its own repo.
            npx npm@latest publish --access public --provenance --tag "$DIST_TAG"
          elif [ "$REGISTRY" = "https://registry.npmjs.org" ]; then
            GITHUB_TOKEN="$TOKEN" NODE_AUTH_TOKEN="$TOKEN" npm publish --access public --provenance --tag "$DIST_TAG"
          else
            GITHUB_TOKEN="$TOKEN" NODE_AUTH_TOKEN="$TOKEN" npm publish --tag "$DIST_TAG"
          fi

  tag:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && inputs.tag-release && needs.publish.outputs.published == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A tag pushed with the workflow token does not re-trigger workflows, so this cannot loop.
      - name: Tag the release
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          CREATE_RELEASE: ${{ inputs.create-release }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — leaving it alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          if [ "$CREATE_RELEASE" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
