name: Publish package

# The ONE publish pipeline for every @max-network npm package.
#
# Each package repo used to carry its own copy of this file. They drifted, and not only in
# wording — the TRIGGER itself diverged, which is a behaviour difference that silently stops
# releases:
#
#   - worker-utils, billing, text-search, i18n publish on a merge to `main`.
#   - hono-ui, mcp-oauth, hono-cms-core published ONLY from a GitHub Release, which is the
#     exact bug the other four repos' own comments describe having fixed ("0.8.0 sat on main
#     unpublished until someone noticed and cut a release by hand"). The fix was applied four
#     times by copy-paste and three repos were missed.
#
# AUTH: the per-run workflow token, not the org PAT.
#
# GH_PACKAGES_TOKEN is present in these repos and npm rejects it -- verified: the run reports
# "GH_PACKAGES_TOKEN (length 40)" and npm still answers 401, so the PAT is expired or revoked
# rather than missing. It also has to be rotated by hand and silently breaks every publish in
# the org when it lapses, which is what happened here.
#
# The workflow token is minted per run, needs no rotation, and can publish a NEW VERSION of an
# EXISTING package, which is every release these repos make. The one thing it cannot do is
# CREATE an org-scoped package that does not exist yet; for that first publish, publish once
# from a laptop with a valid PAT, then every later version goes through here.
#
# The secret is NOT declared as a named `workflow_call` input. It was, as `packages-token`,
# and that silently broke every publish: GitHub secret names cannot contain hyphens, and in an
# expression `secrets.packages-token` parses as `secrets.packages` MINUS `token` -- subtraction,
# not a name. NODE_AUTH_TOKEN got garbage and npm returned 401. Nothing warns you.
#
# RELEASING = BUMPING THE VERSION IN YOUR PR. A merge whose version is already on the
# registry publishes nothing and says so in the run summary, so a docs- or CI-only merge is a
# safe no-op rather than a red build.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node major to build and publish with."
        type: string
        default: "22"
      check-steps:
        description: >-
          Space-separated npm scripts forming the quality gate, passed straight to
          check.yml so a release runs the IDENTICAL suite a pull request does. Publishing
          a package that does not typecheck is worse than publishing late: every consumer
          installs from a semver range, so a broken release reaches them on next install.
        type: string
        default: "typecheck test build"
      tag-release:
        description: "Push a `v<version>` tag at the published commit, so a registry version stays traceable to a commit."
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # The gate is CALLED, not restated, so a release and a pull request cannot drift.
  # Referenced by full path rather than `./` because a `./` path inside a reusable
  # workflow resolves against the CALLING repository, which would look for this file in
  # the package repo instead of here.
  check:
    uses: max-network/.github/.github/workflows/check.yml@main
    with:
      node-version: ${{ inputs.node-version }}
      steps: ${{ inputs.check-steps }}
    secrets: inherit

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.probe.outputs.version }}
      published: ${{ steps.probe.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@max-network"
          cache: npm

      # Installs devDeps and runs `prepare` (the tsc build) so dist/ is fresh; the published
      # tarball ships dist/ per package.json "files", so consumers need no build step.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      # Distinguishes "not published yet" from "could not ask". `npm view` returning
      # non-zero was previously treated as not-published, so ANY registry error -- no read
      # access, network, outage -- turned into an attempt to publish, which then failed with
      # a write error that said nothing about the real cause. Only a genuine 404 means the
      # version is absent; anything else stops the run and prints what npm actually said.
      - name: Is this version already published?
        id: probe
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          set +e
          OUT=$(npm view "$NAME@$VERSION" version 2>&1)
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "\`$NAME@$VERSION\` is already on the registry — nothing to publish. Bump the version in package.json to cut a release." >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s' "$OUT" | grep -q "E404"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Publishing \`$NAME@$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not query the registry for $NAME@$VERSION, so whether it needs publishing is unknown. Refusing to guess."
            echo "$OUT"
            echo "Could not query the registry for \`$NAME@$VERSION\`. If this is a 403, grant this repository write access to the package under Package settings -> Manage Actions access." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publish
        if: steps.probe.outputs.published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

  # A SEPARATE job purely so `contents: write` is static. GitHub Actions does not allow an
  # expression in `permissions:`, and a workflow that tries one fails at STARTUP with no
  # job and no log -- which is how the first version of this file broke billing,
  # text-search and i18n the moment they merged. Least privilege is kept by scoping the
  # write to this job rather than widening the publish job.
  tag:
    needs: publish
    if: inputs.tag-release && needs.publish.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Skipped when the tag already exists, which is the case when this run was itself
      # triggered by pushing that tag. A tag pushed with the workflow token does not
      # re-trigger workflows, so this cannot loop.
      - name: Tag the release
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — leaving it alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
