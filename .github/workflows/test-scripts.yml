name: Test scripts

on:
  pull_request:
    paths: ["scripts/**", ".github/actions/**", ".github/workflows/test-scripts.yml"]
  push:
    branches: [main]
    paths: ["scripts/**", ".github/actions/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun test scripts
