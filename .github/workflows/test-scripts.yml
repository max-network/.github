name: Test scripts

on:
  pull_request:
    paths: ["scripts/**", ".github/workflows/test-scripts.yml"]
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun test scripts
