name: Python check

# ruff lint, ruff format check and pytest under uv, across a Python version matrix.

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions, e.g. ["3.11", "3.12"].'
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -v
