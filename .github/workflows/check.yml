name: Check

# The quality gate for every package caller, run on its pull requests and reused by
# publish-package.yml so a release runs the identical suite.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node major to run the gate on."
        type: string
        default: "26"
      steps:
        description: "Space-separated package scripts to run in order."
        type: string
        default: "typecheck test build"
      runtime:
        description: "`npm` (default) or `bun`. Selects the script runner and the default install."
        type: string
        default: npm
      install:
        description: >-
          `auto` (default) installs with `npm ci` or `bun install --frozen-lockfile` per
          `runtime`. `none` skips the install, for a package without a lockfile. Anything else
          is run as the install command, e.g. `npm ci` for a bun-tested package with a
          package-lock.
        type: string
        default: auto
      working-directory:
        description: "Directory holding the package.json the gate installs and runs, for a repository whose package is not at its root."
        type: string
        default: "."
      timeout-minutes:
        description: "Fail the gate rather than hang a runner."
        type: number
        default: 10
    secrets:
      GH_PACKAGES_TOKEN:
        description: "Classic PAT tried first for private dependencies. Optional; a caller in another org passes it by name."
        required: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  check:
    name: ${{ inputs.steps }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Skip a tree this gate already passed
        id: verified
        uses: max-network/.github/.github/actions/verified-tree@main
        with:
          mode: lookup
          key: ${{ inputs.runtime }} ${{ inputs.install }} ${{ inputs.node-version }} ${{ inputs.steps }}${{ inputs.working-directory != '.' && format(' {0}', inputs.working-directory) || '' }}

      - uses: actions/checkout@v7
        if: steps.verified.outputs.verified != 'true'

      - name: Lockfile follows package.json
        if: steps.verified.outputs.verified != 'true' && github.event_name == 'pull_request' && inputs.install != 'none'
        working-directory: ${{ inputs.working-directory }}
        env:
          RUNTIME: ${{ inputs.runtime }}
          INSTALL: ${{ inputs.install }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIR: ${{ inputs.working-directory }}
        run: |
          case "$INSTALL" in
            auto) [ "$RUNTIME" = bun ] && lock=bun.lock || lock=package-lock.json ;;
            *"npm ci"*|*"npm install"*) lock=package-lock.json ;;
            *"bun install"*) lock=bun.lock ;;
            *"pnpm install"*) lock=pnpm-lock.yaml ;;
            *) exit 0 ;;
          esac
          [ -f "$lock" ] || exit 0
          prefix=""
          [ "$DIR" != "." ] && prefix="${DIR%/}/"
          for other in package-lock.json bun.lock bun.lockb pnpm-lock.yaml yarn.lock; do
            if [ "$other" != "$lock" ] && [ -f "$other" ]; then
              echo "::warning file=${prefix}${other}::This gate installs from $lock; $other is not read by CI and drifts. Keep one installer and one lockfile."
            fi
          done
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- .)
          printf '%s\n' "$changed" | grep -qx "${prefix}package.json" || exit 0
          printf '%s\n' "$changed" | grep -qx "${prefix}${lock}" && exit 0
          git show "$BASE_SHA:${prefix}package.json" > "$RUNNER_TEMP/base-package.json" 2>/dev/null || exit 0
          node -e '
            const fs = require("fs");
            const keys = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies", "overrides", "resolutions", "workspaces", "packageManager"];
            const pick = (file) => { const j = JSON.parse(fs.readFileSync(file, "utf8")); return JSON.stringify(keys.map((k) => j[k] ?? null)); };
            process.exit(pick(process.argv[1]) === pick("package.json") ? 0 : 1);
          ' "$RUNNER_TEMP/base-package.json" && exit 0
          echo "::error file=${prefix}package.json::The dependencies in package.json changed but $lock did not. CI installs from $lock, so update it with the same installer."
          exit 1

      - uses: max-network/.github/.github/actions/setup-bun@main
        if: steps.verified.outputs.verified != 'true' && inputs.runtime == 'bun'
        with:
          bun-version: latest

      # `cache: npm` needs a package-lock.json, so it is only set for an npm install.
      - uses: actions/setup-node@v7
        if: steps.verified.outputs.verified != 'true' && inputs.runtime != 'bun' && inputs.install == 'auto'
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@max-network"
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - uses: actions/setup-node@v7
        if: steps.verified.outputs.verified != 'true' && (inputs.runtime == 'bun' || inputs.install != 'auto')
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@max-network"

      - name: Install dependencies
        if: steps.verified.outputs.verified != 'true' && inputs.install != 'none'
        uses: max-network/.github/.github/actions/install@main
        with:
          command: ${{ inputs.install != 'auto' && inputs.install || (inputs.runtime == 'bun' && 'bun install --frozen-lockfile' || 'npm ci') }}
          pat: ${{ secrets.GH_PACKAGES_TOKEN }}
          workflow-token: ${{ github.token }}
          working-directory: ${{ inputs.working-directory }}

      - name: Run gate
        if: steps.verified.outputs.verified != 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          RUNNER_CMD: ${{ inputs.runtime == 'bun' && 'bun' || 'npm' }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          STEPS: ${{ inputs.steps }}
        run: |
          for s in $STEPS; do
            echo "::group::$RUNNER_CMD run $s"
            "$RUNNER_CMD" run "$s"
            echo "::endgroup::"
          done

      - name: Record the verified tree
        if: steps.verified.outputs.verified != 'true'
        uses: max-network/.github/.github/actions/verified-tree@main
        with:
          mode: record
          key: ${{ inputs.runtime }} ${{ inputs.install }} ${{ inputs.node-version }} ${{ inputs.steps }}${{ inputs.working-directory != '.' && format(' {0}', inputs.working-directory) || '' }}
